<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>EU AI Act Assistant</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 760px; margin: 40px auto; padding: 0 16px; line-height: 1.5; }
  textarea { width: 100%; height: 70px; font: inherit; padding: 8px; box-sizing: border-box; }
  button { margin-top: 8px; padding: 8px 16px; font: inherit; cursor: pointer; }
  #answer { white-space: pre-wrap; background: #f5f5f5; padding: 12px; border-radius: 6px; margin-top: 16px; }
  .source { border-top: 1px solid #ddd; padding: 8px 0; }
  .muted { color: #666; font-size: 0.9em; }
</style>
</head>
<body>
  <h1>EU AI Act Assistant</h1>
  <p class="muted">Answers are generated only from the text of Regulation (EU) 2024/1689.
     Always check the cited pages before relying on an answer.</p>
  <textarea id="question" placeholder="Ask a question in English or Turkish..."></textarea>
  <button id="ask">Ask</button>
  <div id="answer" hidden></div>
  <div id="sources"></div>

<script>
const askBtn = document.getElementById("ask");

askBtn.addEventListener("click", async () => {
  const question = document.getElementById("question").value.trim();
  const answerBox = document.getElementById("answer");
  const sourcesBox = document.getElementById("sources");
  answerBox.hidden = false;
  answerBox.textContent = "Thinking...";
  sourcesBox.innerHTML = "";
  askBtn.disabled = true;

  try {
    const res = await fetch("/ask", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ question }),
    });
    const data = await res.json();
    if (!res.ok) {
      answerBox.textContent = "Error: " + JSON.stringify(data.detail);
      return;
    }

    answerBox.textContent = data.answer;  // textContent, never innerHTML: model output is untrusted
    for (const s of data.sources) {
      const link = document.createElement("a");
      link.href = `/pdf/ai_act.pdf#page=${s.page}`;
      link.target = "_blank";
      link.textContent = `[${s.passage}] Open page ${s.page} in the official PDF`;

      const summary = document.createElement("summary");
      summary.textContent = "Show the passage the model used";
      const passage = document.createElement("p");
      passage.textContent = s.text;
      const details = document.createElement("details");
      details.append(summary, passage);

      const div = document.createElement("div");
      div.className = "source";
      div.append(link, details);
      sourcesBox.append(div);
    }
  } catch (err) {
    answerBox.textContent = "Could not reach the server: " + err;
  } finally {
    askBtn.disabled = false;
  }
});
</script>
</body>
</html>
